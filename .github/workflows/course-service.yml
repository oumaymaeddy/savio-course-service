name: Course service CI

on:
  push:
    branches: [main]
    paths:
      - "savio-course-service/**"
      - ".github/workflows/course-service.yml"
  pull_request:
    paths:
      - "savio-course-service/**"
      - ".github/workflows/course-service.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savio-course-service

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: savio-course-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
