# This service's own PostgreSQL database
services:
  course-db:
    image: postgres:16-alpine
    container_name: savio-course-db
    environment:
      POSTGRES_USER: course_svc
      POSTGRES_PASSWORD: course_svc
      POSTGRES_DB: course_db
    ports:
      - "5432:5432"
    volumes:
      - course-db-data:/var/lib/postgresql/data

volumes:
  course-db-data: